<!DOCTYPE html>
<html>
<head><title>ComicCraft LIVE</title></head>
<body>
<h1>ComicCraft 🚀 LIVE</h1>
<a href="/docs">Go to API Docs</a><br><br>
<a href="/test-image">Test Image (No Purple)</a>
<hr>
<form id="comicForm">
<input type="text" id="prompt" placeholder="brave fox saves forest" style="width:300px">
<select id="style"><option>cartoon comic</option><option>anime</option><option>realistic</option></select>
<button type="submit">Generate 4 Panel Comic</button>
</form>
<div id="result" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:20px"></div>

<script>
document.getElementById('comicForm').onsubmit = async (e) => {
 e.preventDefault();
 const prompt = document.getElementById('prompt').value;
 const style = document.getElementById('style').value;
 const res = await fetch(`/generate?prompt=${encodeURIComponent(prompt)}&style=${encodeURIComponent(style)}`);
 const data = await res.json();
 const div = document.getElementById('result');
 div.innerHTML = '';
 data.panels.forEach(p => {
   div.innerHTML += `<div style="border:1px solid #ccc; padding:10px; width:200px"><img src="${p.image}" width="200"><p>${p.text}</p></div>`;
 });
}
</script>
</body>
</html>
