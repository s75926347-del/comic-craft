<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ComicCraft LIVE</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:20px;text-align:center}.card{background:#222;padding:20px;border-radius:12px;max-width:600px;margin:20px auto}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0;box-sizing:border-box}button{background:#ff6b35;color:#fff;font-weight:bold;cursor:pointer}a{color:#ff6b35}</style>
</head><body>
<h1>🚀 ComicCraft LIVE - FIXED 420</h1>
<h2 style="color:#4caf50">✅ Template Fixed!</h2>
<div class="card">
<input id="p" placeholder="Brave fox learns hacking">
<button onclick="gen()">Generate Comic</button>
<div id="r"></div>
</div>
<a href="/docs">Go to Docs</a> | <a href="/test-image?prompt=fox">Test Image</a>
<script>
async function gen(){
 const prompt=document.getElementById('p').value;
 if(!prompt)return alert('prompt podu');
 document.getElementById('r').innerHTML='⏳ Generating...';
 const fd=new FormData();fd.append('prompt',prompt);fd.append('style','cartoon comic');
 try{const res=await fetch('/generate',{method:'POST',body:fd});const data=await res.json();let h='';if(data.panels){data.panels.forEach((pl,i)=>{h+=`<div style="margin:10px 0;background:#333;padding:10px;border-radius:8px"><p>${pl.text}</p><img src="${pl.image}" style="width:100%"></div>`})}else{h=`<pre>${JSON.stringify(data,null,2)}</pre>`}document.getElementById('r').innerHTML=h}catch(e){document.getElementById('r').innerHTML=e.message}
}
</script></body></html>
